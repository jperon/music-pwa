<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0f0e17"/>
  <!-- Staff lines -->
  <line x1="80" y1="200" x2="432" y2="200" stroke="#2e2d45" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="230" x2="432" y2="230" stroke="#2e2d45" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="260" x2="432" y2="260" stroke="#2e2d45" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="290" x2="432" y2="290" stroke="#2e2d45" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#2e2d45" stroke-width="8" stroke-linecap="round"/>
  <!-- Treble clef (simplified) -->
  <text x="82" y="330" font-family="serif" font-size="180" fill="#e2a84b" opacity="0.9">𝄞</text>
  <!-- Quarter note -->
  <ellipse cx="320" cy="290" rx="22" ry="16" fill="#e2a84b" transform="rotate(-15 320 290)"/>
  <line x1="340" y1="285" x2="340" y2="160" stroke="#e2a84b" stroke-width="10" stroke-linecap="round"/>
  <!-- Eighth note -->
  <ellipse cx="400" cy="320" rx="22" ry="16" fill="#c97b38" transform="rotate(-15 400 320)"/>
  <line x1="420" y1="315" x2="420" y2="190" stroke="#c97b38" stroke-width="10" stroke-linecap="round"/>
  <path d="M420 190 Q455 210 440 240" stroke="#c97b38" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
